upstream backend {
    server backend:8800;
}

upstream frontend {
    server frontend:3800;
}

# Cloudflare Tunnel (and similar reverse proxies) send X-Forwarded-Proto: https.
# The hop from cloudflared to nginx is HTTP, so $scheme would otherwise be http.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name market-signal.me www.market-signal.me market-signal.haojianli.me;
    client_max_body_size 10m;

    # Keep image stdout/stderr (docker compose logs) and also write the host bind mount.
    access_log /var/log/nginx/access.log;
    access_log /var/log/amtsm/access.log;
    error_log /var/log/nginx/error.log notice;
    error_log /var/log/amtsm/error.log notice;

    # Docker HEALTHCHECK hits this every interval; keep it out of access logs.
    location = /api/health {
        access_log off;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        # Long enough for SSE heartbeats (~30s); short enough to drop dead
        # upstream connections from tunnel reconnect storms.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
