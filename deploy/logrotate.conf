# Host-file rotation for bind-mounted deploy/log (mounted at /var/log/amtsm).
# cloudflared uses lumberjack (1MB x 5); do not rotate that directory.

missingok
notifempty
compress
delaycompress

/var/log/amtsm/backend/*.log
/var/log/amtsm/frontend/*.log
/var/log/amtsm/nginx/*.log
{
    size 10M
    rotate 3
    missingok
    notifempty
    copytruncate
    compress
    delaycompress
}
